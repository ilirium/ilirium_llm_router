[project]
name = "ilirium-llm-router"
version = "0.1.0"
description = "Routes one coding harness to Anthropic and locally served models at the same time."
readme = "README.md"
authors = [
    { name = "Ilya 'Ilirium' Kalimulin", email = "ilirium115@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.9",
    "httpx>=0.28.1",
    # Both are imported directly by src/ rather than only reached through FastAPI: `pydantic` builds
    # every config model, and `starlette` supplies Request, the responses and ClientDisconnect. They
    # arrived transitively for five phases, which meant the router's real requirement was whatever
    # FastAPI happened to ask for, and a release that moved either would have broken us with nothing
    # here to say what we needed. Declared in Phase 6 — same discipline as pinning ruff.
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
ilirium-llm-router = "ilirium_llm_router.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
# The codebase is written at 100 columns and always has been; ruff's default is 88. Without this
# line `make format` rewrote every file it was pointed at, which made the target unsafe to run and
# meant any phase branch that touched it carried a pile of unrelated churn.
#
# 100 is measured rather than chosen: the widest lines here are 100 characters, and the dozen that
# exceed it are comments and docstrings, which the formatter does not rewrap. Note that `ruff check`
# is unaffected either way — line length is `E501`, which is not in ruff's default rule set, so this
# setting governs the formatter alone.
line-length = 100
