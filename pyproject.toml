[project]
name = "ilirium-llm-router"
version = "0.1.0"
description = "Routes one coding harness to Anthropic and locally served models at the same time."
readme = "README.md"
authors = [
    { name = "Ilya 'Ilirium' Kalimulin", email = "ilirium115@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.9",
    # `h2` is httpx's HTTP/2 stack, pulled in deliberately rather than via the `httpx[http2]` extra
    # so that it is visible in this list. PHASE 14 EXPERIMENT, 2026-09-18: the router spoke HTTP/1.1
    # to Anthropic while Claude Code talking directly speaks HTTP/2, and the safety classifier works
    # on the direct path and fails through the router.
    #
    # It came back NEGATIVE, and this line stays anyway -- 2026-09-19, the owner's choice of a
    # config switch over deletion. `experiments.http2_upstream` is OFF by default, so the stack is
    # installed and unused until somebody turns it on. Deleting it would make the switch a lie.
    # Inbound is HTTP/1.1 regardless: uvicorn speaks only `h11`/`httptools`. -> `BKL-0039`.
    "h2>=4.1.0",
    "httpx>=0.28.1",
    # Both are imported directly by src/ rather than only reached through FastAPI: `pydantic` builds
    # every config model, and `starlette` supplies Request, the responses and ClientDisconnect. They
    # arrived transitively for five phases, which meant the router's real requirement was whatever
    # FastAPI happened to ask for, and a release that moved either would have broken us with nothing
    # here to say what we needed. Declared in Phase 6 — same discipline as pinning ruff.
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.51.0",
    # The corpus write path compresses bodies, and Python 3.13 has no `compression.zstd` — that
    # module arrived in 3.14. Every zstd figure this project owns came from the `zstd` CLI binary,
    # which the router itself has never called. Shelling out per body and bumping to 3.14 were both
    # offered and declined in Phase 10; this is the third option, and it is one tool for the router
    # and the offline trainer alike.
    #
    # A runtime dependency rather than a dev one: `corpus.py` imports it at module scope. On CPython
    # the package requires its C extension — `backend_cffi` is a PyPy fallback and is not the code
    # path here. That extension releases the GIL around every call into libzstd, which is what makes
    # the single worker thread a real thread rather than a rename; Phase 10 Task 4 verified it
    # against the shipped binary rather than the documentation.
    "zstandard>=0.25.0",
]

[project.scripts]
ilirium-llm-router = "ilirium_llm_router.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# PHASE 14 EXPERIMENT, 2026-09-18, and its own group so it is NOT installed by `uv sync` or pulled
# in by `uv run`. `curl_cffi` exists to make an HTTP client's TLS handshake look like a browser's;
# it is here to test whether the 429 is a bot score against scripted-client fingerprints, and it is
# reached only through `make forwarder`. Nothing under `src/` imports it. It comes out with the
# experiment -- see `docs/method/IDM-003-development-tooling.md` on what earns a dependency.
experiment = [
    "curl-cffi>=0.16.3",
]

[tool.ruff]
# The codebase is written at 100 columns and always has been; ruff's default is 88. Without this
# line `make format` rewrote every file it was pointed at, which made the target unsafe to run and
# meant any phase branch that touched it carried a pile of unrelated churn.
#
# 100 is measured rather than chosen: the widest lines here are 100 characters, and the dozen that
# exceed it are comments and docstrings, which the formatter does not rewrap. Note that `ruff check`
# is unaffected either way — line length is `E501`, which is not in ruff's default rule set, so this
# setting governs the formatter alone.
line-length = 100
