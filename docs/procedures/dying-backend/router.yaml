# The router configured for failure testing. See README.md in this directory.
#
# Two things are deliberate. The port is 8799 rather than 8787, and the backend is 1299 rather than
# 1234, so this runs *alongside* a working router and a real LM Studio without disturbing either —
# every measurement in phase-3-notes.md was taken that way. And the log and CSV go to `runs/`, which
# is gitignored, so exercising the failure paths does not leave artefacts in `docs/`.

server:
  host: 127.0.0.1
  port: 8799

backends:
  # Unused here: nothing in this directory sends a `claude-` model anywhere. Kept because the config
  # requires both backends, and pointing it at the real address is more honest than a fake one that
  # would send traffic somewhere unexpected if a test ever did name a Claude model.
  anthropic:
    base_url: https://api.anthropic.com
    credential: forward

  # Where the failures come from. With `dying_backend.py` running, this answers and then breaks;
  # with nothing running, it is the unreachable-backend case. Both are wanted.
  lmstudio:
    base_url: http://127.0.0.1:1299
    credential: strip

logging:
  level: INFO
  file: runs/router.log
  max_bytes: 10485760
  backup_count: 5

stats:
  file: runs/calls.csv
  max_bytes: 5242880
  backup_count: 10

# The body store, added 2026-08-20 for Phase 10's Task 18 — the driving check that gates the
# harvest. On here, and off in `../../../config.yaml`, which is the right way round: this file is a
# failure-testing instrument whose whole purpose is to be run, and its output already goes to
# `runs/`, which is gitignored.
#
# `dir` is under `runs/` for the same reason the log and the CSV are. `logs/corpus/` is the record
# of REAL traffic and nothing synthetic belongs in it — Task 15 declined to file Phase 9's captured
# bodies there for exactly this reason, and stub traffic has even less claim.
corpus:
  enabled: true
  dir: runs/corpus
  compress_level_zstd: 9
  body_max_bytes: 1048576
  queue_max_bytes: 67108864
  retrain:
    window_days: 1
    sample_min_bytes: 1024
    maxdict: 262144
    k: 8000
