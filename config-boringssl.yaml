# Phase 14 experiment: the router with a BoringSSL egress hop.
#
#   Claude Code -> this router -> http://127.0.0.1:8799 -> TLS(chrome) -> api.anthropic.com
#
# WHY. Ten hypotheses have been eliminated by measurement and what is left sits below HTTP: the
# router's TLS ClientHello is visibly not Claude Code's. `docs/.../evidence/boringssl-forwarder.py`
# puts a BoringSSL stack in the egress path so that hypothesis can be tested at all.
#
# HOW.  make forwarder          # terminal 1 -- must be running first
#       make run-boringssl      # terminal 2 -- this file
#
# THIS FILE IS THE EXPERIMENT AND COMES OUT WITH IT. It exists so `config.yaml` never has to be
# hand-edited: that file is compared byte for byte against the shipped starter by
# `test_template_matches_the_repository_config`, and editing it turns the test red for as long as
# the edit lives.
#
# It differs from `config.yaml` in exactly three places, each marked EXPERIMENT below.
# Log and corpus paths are deliberately the SAME, so a run through the forwarder lands in the same
# files as every earlier run and the two can be read against each other.

# Configuration for ilirium_llm_router.
#
# There is deliberately no model list here. Routing is a rule in code: a model named `claude-…`
# goes to Anthropic, anything else goes to LM Studio. New models on either side need no change here.
#
# Relative paths below are resolved against the directory holding this file.

server:
  host: 127.0.0.1
  port: 8787

backends:
  # `credential` is the only knob, and it has three modes:
  #
  #   forward   pass the credential arriving from the caller through untouched
  #   strip     remove it
  #   inject    remove it and send the key named by `api_key_env` instead
  #
  # `api_key_env` is required by `inject` and forbidden by the other two. Both contradictions are
  # refused at startup rather than resolved silently.

  # `read_timeout` is how long a backend may stay *silent* before the call is abandoned. It is not
  # a budget for the whole reply: every chunk that arrives restarts it, measured 2026-08-07 in
  # docs/milestone-1-core/phase-5-config-and-timeouts/evidence/. So it bounds silence, never
  # duration.

  # Models named `claude-…`.
  anthropic:
    # EXPERIMENT 1: the BoringSSL forwarder instead of Anthropic directly. `make forwarder`
    # must be running, or every Anthropic call fails with connect_error.
    base_url: http://127.0.0.1:8799
    # The arriving credential is the real one and Anthropic accepts it, so the router holds no key
    # of its own. See docs/procedures/anthropic-auth-check.md.
    credential: forward
    # Measured median time to first byte is 1426 ms — over successful streamed /v1/messages calls,
    # which is the slice that number means — so ten minutes of silence already means something is
    # wrong rather than slow.
    read_timeout: 600

  # Every other model.
  lmstudio:
    base_url: http://localhost:1234
    # A real Anthropic token is of no use to a local server and should not be handed to something
    # that might write it to a log.
    credential: strip
    # Prefilling a large prompt is silent while it works: 27924 tokens took 197 s, and a ~41000-token
    # request was still going when the old shared 600 s killed it
    # (docs/milestone-1-core/phase-4-lmstudio-parity/notes.md).
    read_timeout: 1800
    # If LM Studio's "Require Authentication" is switched on, this takes two lines: change the mode
    # above to `inject` and name the variable holding the key here.
    # api_key_env: LMSTUDIO_API_KEY

logging:
  level: INFO
  file: logs/telemetry/router.log
  max_bytes: 10485760   # 10 MiB
  backup_count: 5

stats:
  file: logs/telemetry/calls.csv
  max_bytes: 5242880    # 5 MiB
  backup_count: 10

# The body store. Opt-in, off by default, and nothing under `dir` is created until it is on.
#
# `calls.csv` above is always on because it is cheap and holds nothing sensitive. Neither is true
# here: bodies hold source code, file contents and anything typed. So this is one switch, and off.
corpus:
  # EXPERIMENT 2: on, so a run keeps capturing bodies the way every earlier run did.
  enabled: true
  dir: logs/corpus
  # The level bodies are stored at -- AND the level the trainer scores a candidate dictionary
  # against the incumbent at, so the comparison cannot drift from what is actually stored. It is
  # NOT the level a dictionary is trained at; that is TRAIN_LEVEL = 3, measured to move the ratio
  # by 0.03%. 9 was measured by Task 6: 94% of level 19's dicted ratio for an eighth of the cost.
  compress_level_zstd: 9
  # Two limits, because they are checked at two different moments and neither can cover the other.
  # This one bounds peak memory for ONE body, on every chunk while the call runs.
  # EXPERIMENT 3: 5 MiB rather than the shipped 1 MiB, matching the owner's running setup.
  body_max_bytes: 5242880     # 5 MiB
  # And this one bounds memory for ALL WAITING bodies, once at submit. A thousand ordinary 100 KB
  # bodies are each far under the ceiling and together are 100 MB in the queue.
  queue_max_bytes: 67108864   # 64 MiB
  # Everything below runs offline, in its own thread, and never in the path of a call.
  retrain:
    window_days: 1            # a MINIMUM; 0 disables automatic retraining entirely
    sample_min_bytes: 1024
    # Both provisional rather than measured-optimal: the corpus has no usable validation split, so
    # these were chosen knowing the slice they were scored on. Training is non-monotonic in both.
    maxdict: 262144
    k: 8000

# All three router experiments OFF, written out rather than left to their defaults so that a run
# through the forwarder varies the TLS stack and NOTHING ELSE. See config-hosts.yaml for why this
# block is explicit rather than omitted.
experiments:
  relay_accept_encoding: false
  http2_upstream: false
  imitate_attribution_headers: false
  # Put back the attribution block Claude Code withholds when ANTHROPIC_BASE_URL names any host but
  # api.anthropic.com -- the reason every non-streamed /v1/messages comes back 429 and auto mode's
  # safety classifier cannot run through a proxy. Turn this on if the classifier reports itself
  # unavailable. THE ONE DELIBERATE EXCEPTION TO BYTE-RELAY: a request it applies to is parsed,
  # given one more element in its `system` array, and re-serialised, so its prompt-cache prefix
  # changes. Narrowed to the Anthropic backend, non-streamed, uncompressed, and bodies that do not
  # already carry a block -- streamed requests were never refused and keep byte-relay untouched.
  # Two hardcoded fields and three deliberate omissions: see backend_anthropic.py, and
  # docs/bugs/BUG-001-non-streaming-messages-rejected-as-rate-limited.md.
  add_claude_code_hidden_attribution_block: false
