# Configuration for ilirium_llm_router.
#
# There is deliberately no model list here. Routing is a rule in code: a model named `claude-…`
# goes to Anthropic, anything else goes to LM Studio. New models on either side need no change here.
#
# Relative paths below are resolved against the directory holding this file.

server:
  host: 127.0.0.1
  port: 8787

backends:
  # `credential` is the only knob, and it has three modes:
  #
  #   forward   pass the credential arriving from the caller through untouched
  #   strip     remove it
  #   inject    remove it and send the key named by `api_key_env` instead
  #
  # `api_key_env` is required by `inject` and forbidden by the other two. Both contradictions are
  # refused at startup rather than resolved silently.

  # Models named `claude-…`.
  anthropic:
    base_url: https://api.anthropic.com
    # The arriving credential is the real one and Anthropic accepts it, so the router holds no key
    # of its own. See docs/anthropic-auth-check.md.
    credential: forward

  # Every other model.
  lmstudio:
    base_url: http://localhost:1234
    # A real Anthropic token is of no use to a local server and should not be handed to something
    # that might write it to a log.
    credential: strip
    # If LM Studio's "Require Authentication" is switched on, this takes two lines: change the mode
    # above to `inject` and name the variable holding the key here.
    # api_key_env: LMSTUDIO_API_KEY

logging:
  level: INFO
  file: logs/router.log
  max_bytes: 10485760   # 10 MiB
  backup_count: 5

stats:
  file: logs/calls.csv
  max_bytes: 5242880    # 5 MiB
  backup_count: 10
